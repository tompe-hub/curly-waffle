<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}cadre-watch{% endblock %}</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #16150f; --muted: #6b6a63; --line: #e2e1dc;
    --card: #ffffff; --accent: #8a2f24; --warn: #8a6a1f; --ok: #2f6a3f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#e8e7e2; --muted:#9b9a93; --line:#2c2c31;
            --card:#1d1d21; --accent:#d97862; --warn:#d4a94f; --ok:#7fbf8f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Noto Sans SC", sans-serif; }
  header { border-bottom:1px solid var(--line); padding:.7rem 1.2rem; display:flex;
           gap:1.4rem; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:1rem; margin:0; letter-spacing:.02em; }
  nav a { color:var(--muted); text-decoration:none; margin-right:1rem; font-size:.9rem; }
  nav a:hover, nav a.on { color:var(--fg); }
  .badge { background:var(--accent); color:#fff; border-radius:999px;
           padding:0 .45em; font-size:.75rem; margin-left:.25em; }
  main { max-width:56rem; margin:0 auto; padding:1.4rem 1.2rem 4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:.9rem 1rem; margin-bottom:.7rem; }
  .row { display:flex; justify-content:space-between; gap:1rem; align-items:baseline; }
  .name { font-size:1.05rem; font-weight:600; }
  .name a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  .kind { color:var(--accent); font-weight:600; font-size:.85rem;
          text-transform:uppercase; letter-spacing:.04em; }
  .meta { color:var(--muted); font-size:.82rem; }
  .sig { font-variant-numeric:tabular-nums; color:var(--muted); font-size:.82rem; }
  blockquote { margin:.6rem 0 .3rem; padding:.5rem .75rem; border-left:3px solid var(--line);
               background:rgba(128,128,128,.06); font-size:.92rem; }
  .gloss { color:var(--muted); font-size:.85rem; font-style:italic; margin:.15rem 0 .5rem .75rem; }
  form.inline { display:inline; }
  button { font:inherit; font-size:.8rem; padding:.2rem .6rem; cursor:pointer;
           background:transparent; color:var(--muted);
           border:1px solid var(--line); border-radius:5px; }
  button:hover { color:var(--fg); border-color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:.8rem; }
  .empty { color:var(--muted); padding:2.5rem 0; text-align:center; }
  .warn { color:var(--warn); } .ok { color:var(--ok); } .err { color:var(--accent); }
  .guessed { border-left:3px solid var(--warn); }
</style>
</head>
<body>
<header>
  <h1>cadre-watch</h1>
  <nav>
    <a href="/" class="{{ 'on' if request.url.path == '/' else '' }}">What's new{% if counts and counts.new_events %}<span class="badge">{{ counts.new_events }}</span>{% endif %}</a>
    <a href="/review" class="{{ 'on' if request.url.path == '/review' else '' }}">Review{% if counts and counts.review %}<span class="badge">{{ counts.review }}</span>{% endif %}</a>
    <a href="/runs" class="{{ 'on' if request.url.path == '/runs' else '' }}">Runs</a>
  </nav>
  <span class="meta" style="margin-left:auto">{{ counts.people }} people · {{ counts.documents }} documents</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
