<h1>全国人民代表大会常务委员会关于任免的决定</h1>
<p class="date">发布时间：2024-09-13</p>
<p>第十四届全国人民代表大会常务委员会第十一次会议决定：</p>
<p>免去唐仁健的农业农村部部长职务。</p>
<p>任命韩俊为农业农村部部长。</p>
<p>免去王强的司法部副部长职务；任命王强为最高人民检察院副检察长。</p>
<p>撤销赵国平的第十四届全国人民代表大会代表职务。</p>
<p>接受孙立民辞去全国人民代表大会常务委员会委员的请求。</p>
</div>
