<h1>中国光大集团股份公司原党委书记、董事长李晓鹏被开除党籍</h1>
<p class="date">发布时间：2024-01-16</p>
<p>日前，经中共中央批准，中央纪委国家监委对中国光大集团股份公司原党委书记、董事长李晓鹏严重违纪违法问题进行了立案审查调查。</p>
<p>经查，李晓鹏丧失理想信念，背弃初心使命，对党不忠诚不老实，落实党中央决策部署不力。</p>
<p>依据有关规定，经中央纪委常委会会议研究并报中共中央批准，决定给予李晓鹏开除党籍处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。</p>
</div>
